name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-addon:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: frenck/action-addon-linter@v2.21
        with:
          path: "./spoolsync"

  tests:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r spoolsync/requirements.txt pytest pytest-asyncio ruff==0.16.9
      - run: ruff check spoolsync/rootfs/opt/spoolsync tests
      - run: pytest -q
