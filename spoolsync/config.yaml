name: SpoolSync
version: "0.1.1"
slug: spoolsync
description: >-
  Gleicht die Filamentspulen zwischen Spoolman und der Bambu-Lab-Cloud (Bambu Studio,
  Bambu Handy) in beide Richtungen ab – Material, Farbe, Gewicht und Restgewicht.
url: https://github.com/Telo87/ha-spoolsync
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:printer-3d-nozzle
panel_title: SpoolSync
options:
  spoolman_url: "http://homeassistant.local:7912"
  interval_minutes: 5
  auto_sync: false
  conflict_winner: spoolman
  sync_deletions: true
  book_bambu_prints: true
  log_level: info
schema:
  spoolman_url: url
  interval_minutes: int(1,1440)
  auto_sync: bool
  conflict_winner: list(spoolman|bambu)
  sync_deletions: bool
  book_bambu_prints: bool
  log_level: list(debug|info|warning|error)
